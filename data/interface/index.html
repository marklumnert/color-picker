    <div class="picker">
      <table>
        <tr>
          <td class="button" title="Click here to pick a new color">
            <input id="picker" type="color">
          </td>
          <td class="fill" id="details">
            <input type="text" value="Loading...">
            <input type="text" value="Loading...">
            <input type="text" value="Loading...">
            <input type="text" value="Loading...">
            <input type="text" value="Loading...">
            <input type="text" value="Loading...">
          </td>
        </tr>
      </table>
    </div>
    <!--  -->
    <div class="pane" id="pane-settings" hidden>
      <div class="pane-row head">
        <span>Settings</span>
        <span class="hint">Close to return to the picker</span>
      </div>
      <div class="pane-row">
        <span>Theme</span>
        <span class="pane-value">
          <input type="radio" id="theme-light" name="theme-choice" value="light"><label for="theme-light">Light</label>
          <input type="radio" id="theme-dark" name="theme-choice" value="dark"><label for="theme-dark">Dark</label>
          <input type="radio" id="theme-auto" name="theme-choice" value="auto"><label for="theme-auto">Auto</label>
        </span>
      </div>
      <div class="pane-row">
        <span>Tile size (px)</span>
        <span class="pane-value"><input id="setting-size" type="number" value="28" min="8" max="128" step="1"></span>
      </div>
      <div class="pane-row">
        <span>Notification timeout (seconds)</span>
        <span class="pane-value"><input id="setting-timeout" type="number" value="5" min="1" max="20" step="1"></span>
      </div>
      <div class="pane-row">
        <span>Auto add to palette</span>
        <span class="pane-value"><input id="setting-autoadd" type="checkbox"></span>
      </div>
      <div class="pane-row">
        <span>Whole page scroll</span>
        <span class="pane-value"><input id="setting-pagescroll" type="checkbox"></span>
      </div>
      <div class="pane-row head sub">
        <span>Sections</span>
        <span class="scontrols-inline" id="section-actions">
          <button id="section-open" type="button" hidden></button>
          <button id="section-check" type="button" hidden></button>
        </span>
        <span class="hint">Uncheck to hide a section</span>
      </div>
      <div class="pane-grid" id="section-list"></div>
      <div class="pane-row reset">
        <span>Factory reset</span>
        <span class="pane-value"><button id="setting-reset" type="button">Reset everything to defaults</button></span>
      </div>
    </div>
    <!--  -->
    <div class="pane" id="pane-paste" hidden>
      <div class="pane-row head">
        <span>Import settings</span>
        <span class="hint">Paste the exported text below</span>
      </div>
      <textarea id="paste-text" spellcheck="false" placeholder="Paste the exported settings text here"></textarea>
      <div class="pane-actions">
        <button id="paste-cancel" type="button">Cancel</button>
        <button id="paste-apply" type="button">Import</button>
      </div>
    </div>

    <div class="sections" id="sections"></div>
